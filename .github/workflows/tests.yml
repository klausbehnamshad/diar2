name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg shellcheck zsh
      - run: python -m pip install pytest pyannote.metrics==4.1
      - run: python -m pytest -q tests
      - run: shellcheck -s bash diar2.sh install_mac.sh selftest_mac.sh
